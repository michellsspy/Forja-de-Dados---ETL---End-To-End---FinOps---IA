
# =============================================================================
# PROJETO: Forja de Dados - ETL End to End - FinOps - IA
# ARQUIVO: databricks.yml
#
# OBJETIVO:
#   Configurar os ambientes DEV, HML e PRD utilizando
#   Databricks Declarative Automation Bundles.
#
# ARQUITETURA:
#   - Databricks e Unity Catalog
#   - Lakeflow Connect
#   - Lakeflow Spark Declarative Pipelines
#   - Lakeflow Jobs
#   - Delta Lake Managed Tables
#
# CONTROLE DE VERSAO:
#   GitHub / GitHub Actions
#
# DIRETRIZES:
#   - Workspace compartilhado entre DEV, HML e PRD.
#   - Isolamento logico por catalogos Unity Catalog.
#   - DEV permite deployment por Service Principal.
#   - HML e PRD utilizam mode: production.
#   - root_path fixo para preservar o estado dos deployments.
#   - Nenhuma credencial armazenada neste arquivo.
#
# OBSERVACAO:
#   DEV utiliza presets explicitos em vez de mode: development.
#   Isso permite compartilhar o deployment entre identidades
#   sem a restricao de isolamento individual do development mode.
# =============================================================================

bundle:
  name: forja_de_dados

# =============================================================================
# RECURSOS DECLARATIVOS
# =============================================================================

include:
  - resources/jobs/*.yml

# =============================================================================
# VARIAVEIS GLOBAIS
# =============================================================================

variables:
  catalog_lakehouse:
    description: "Catalogo das camadas de dados"

  catalog_platform:
    description: "Catalogo de controle, qualidade e observabilidade"

  catalog_analytics:
    description: "Catalogo dos produtos analiticos"

# =============================================================================
# TARGETS
# =============================================================================

targets:

  # ---------------------------------------------------------------------------
  # DEV - DESENVOLVIMENTO E AUTOMACAO
  # ---------------------------------------------------------------------------
  dev:
    default: true

    # Preserva os comportamentos desejados de desenvolvimento,
    # sem exigir um root_path especifico para cada usuario.
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1

    # Mantem o deployment existente e seu estado remoto.
    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_dev
      catalog_platform: forja_platform_dev
      catalog_analytics: forja_analytics_dev

  # ---------------------------------------------------------------------------
  # HML - HOMOLOGACAO
  # ---------------------------------------------------------------------------
  hml:
    mode: production

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_hml
      catalog_platform: forja_platform_hml
      catalog_analytics: forja_analytics_hml

  # ---------------------------------------------------------------------------
  # PRD - PRODUCAO
  # ---------------------------------------------------------------------------
  prd:
    mode: production

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_prd
      catalog_platform: forja_platform_prd
      catalog_analytics: forja_analytics_prd
