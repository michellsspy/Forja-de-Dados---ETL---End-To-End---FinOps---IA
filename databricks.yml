
# =============================================================================
# PROJETO: Forja de Dados - ETL End to End - FinOps - IA
# ARQUIVO: databricks.yml
#
# OBJETIVO:
#   Configurar os ambientes DEV, HML e PRD utilizando
#   Databricks Declarative Automation Bundles.
#
# ARQUITETURA:
#   - Databricks / Unity Catalog
#   - Lakeflow Connect
#   - Lakeflow Spark Declarative Pipelines
#   - Lakeflow Jobs
#   - Delta Lake Managed Tables
#
# CONTROLE DE VERSAO:
#   GitHub - Git
#
# OBSERVACOES:
#   - Workspace compartilhado entre os tres ambientes.
#   - Isolamento logico por catalogos Unity Catalog.
#   - DEV utiliza comportamento de desenvolvimento.
#   - HML e PRD utilizam comportamento de producao.
#   - HML e PRD possuem caminhos fixos de implantacao.
#   - Nenhuma credencial e armazenada neste arquivo.
#   - Catalogos serao provisionados posteriormente.
# =============================================================================

bundle:
  name: forja_de_dados

# =============================================================================
# VARIAVEIS GLOBAIS
# =============================================================================

variables:
  catalog_lakehouse:
    description: "Catalogo das camadas de dados"

  catalog_platform:
    description: "Catalogo de controle, qualidade e observabilidade"

  catalog_analytics:
    description: "Catalogo dos produtos analiticos"

# =============================================================================
# TARGETS - AMBIENTES
# =============================================================================

targets:

  # ---------------------------------------------------------------------------
  # DEV - DESENVOLVIMENTO
  # ---------------------------------------------------------------------------
  dev:
    default: true
    mode: development

    variables:
      catalog_lakehouse: forja_lakehouse_dev
      catalog_platform: forja_platform_dev
      catalog_analytics: forja_analytics_dev

  # ---------------------------------------------------------------------------
  # HML - HOMOLOGACAO
  # ---------------------------------------------------------------------------
  hml:
    mode: production

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_hml
      catalog_platform: forja_platform_hml
      catalog_analytics: forja_analytics_hml

  # ---------------------------------------------------------------------------
  # PRD - PRODUCAO
  # ---------------------------------------------------------------------------
  prd:
    mode: production

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_prd
      catalog_platform: forja_platform_prd
      catalog_analytics: forja_analytics_prd
