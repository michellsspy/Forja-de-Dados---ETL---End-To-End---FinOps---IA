
# =============================================================================
# PROJETO: Forja de Dados - ETL End to End - FinOps - IA
# ARQUIVO: databricks.yml
#
# OBJETIVO:
#   Configurar os Databricks Declarative Automation Bundles
#   para os ambientes DEV, HML e PRD.
#
# ARQUITETURA:
#   - Databricks e Unity Catalog
#   - Lakeflow Connect
#   - Lakeflow Spark Declarative Pipelines
#   - Lakeflow Jobs
#   - Delta Lake Managed Tables
#
# VERSIONAMENTO:
#   GitHub e GitHub Actions
#
# DIRETRIZES:
#   - Workspace compartilhado entre os ambientes.
#   - Isolamento logico por catalogos Unity Catalog.
#   - Implantacoes identificadas por root_path.
#   - Nenhuma credencial armazenada neste arquivo.
#   - Jobs e pipelines definidos em arquivos separados.
#
# OBSERVACAO:
#   O root_path de DEV preserva o estado do deployment
#   originalmente criado pela identidade pessoal.
#   O Service Principal ja possui CAN_MANAGE no diretorio.
# =============================================================================

bundle:
  name: forja_de_dados

# =============================================================================
# RECURSOS DECLARATIVOS
# =============================================================================

include:
  - resources/jobs/*.yml

# =============================================================================
# VARIAVEIS GLOBAIS
# =============================================================================

variables:
  catalog_lakehouse:
    description: "Catalogo das camadas de dados"

  catalog_platform:
    description: "Catalogo de controle, qualidade e observabilidade"

  catalog_analytics:
    description: "Catalogo dos produtos analiticos"

# =============================================================================
# AMBIENTES DE IMPLANTACAO
# =============================================================================

targets:

  # ---------------------------------------------------------------------------
  # DEV - DESENVOLVIMENTO
  # ---------------------------------------------------------------------------
  dev:
    default: true
    mode: development

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_dev
      catalog_platform: forja_platform_dev
      catalog_analytics: forja_analytics_dev

  # ---------------------------------------------------------------------------
  # HML - HOMOLOGACAO
  # ---------------------------------------------------------------------------
  hml:
    mode: production

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_hml
      catalog_platform: forja_platform_hml
      catalog_analytics: forja_analytics_hml

  # ---------------------------------------------------------------------------
  # PRD - PRODUCAO
  # ---------------------------------------------------------------------------
  prd:
    mode: production

    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog_lakehouse: forja_lakehouse_prd
      catalog_platform: forja_platform_prd
      catalog_analytics: forja_analytics_prd
