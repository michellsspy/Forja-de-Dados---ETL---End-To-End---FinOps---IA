# =============================================================================
# PROJETO: Forja de Dados - ETL End to End - FinOps - IA
# ARQUIVO: databricks.yml
# OBJETIVO: Definir os alvos DEV/HML/PRD e descobrir recursos Lakeflow.
# INFRAESTRUTURA: 1 workspace; catálogos UC por ambiente; tabelas gerenciadas.
# CONTROLE: GitHub; CI/CD com Databricks Declarative Automation Bundles.
# SEGURANCA: nenhuma credencial neste arquivo; root_path DEV preservado.
# EXECUCAO: databricks bundle validate -t dev
# =============================================================================

bundle:
  name: forja_de_dados

include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml

variables:
  catalog_lakehouse:
    description: "Catalogo das camadas de dados"
  catalog_platform:
    description: "Catalogo de controle, qualidade e observabilidade"
  catalog_analytics:
    description: "Catalogo dos produtos analiticos"

targets:
  dev:
    default: true
    # Sem mode: development porque o deploy e compartilhado com Service Principal.
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1
    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_lakehouse: forja_lakehouse_dev
      catalog_platform: forja_platform_dev
      catalog_analytics: forja_analytics_dev

  hml:
    mode: production
    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_lakehouse: forja_lakehouse_hml
      catalog_platform: forja_platform_hml
      catalog_analytics: forja_analytics_hml

  prd:
    mode: production
    workspace:
      root_path: /Workspace/Users/michel.laboratorios@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_lakehouse: forja_lakehouse_prd
      catalog_platform: forja_platform_prd
      catalog_analytics: forja_analytics_prd
