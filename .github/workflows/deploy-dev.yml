# =============================================================================
# PROJETO: Forja de Dados - ETL End to End - FinOps - IA
# ARQUIVO: .github/workflows/deploy-dev.yml
# OBJETIVO:
#   Implantar Jobs e Pipelines Lakeflow em DEV a partir do GitHub Actions.
#   Reutilizar o validador de plano em scripts/ci/validate_bundle_plan.py.
#   Aceitar planos sem mudancas, sem executar deploy desnecessario.
# GATILHOS:
#   - CI aprovado na branch main.
#   - Execucao manual na branch main.
# SEGURANCA:
#   - OAuth M2M via GitHub Secrets.
#   - Validacao de plano antes da implantacao.
#   - Exclusoes bloqueadas pelo validador do projeto.
#   - Mesmo plano validado e aplicado pelo Direct Deployment Engine.
#   - Nao implantar um commit antigo caso a main tenha avancado.
# =============================================================================

name: CD - Deploy Databricks DEV

on:
  workflow_run:
    workflows: ["CI - Forja de Dados"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-cd-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Implantar Jobs e Pipelines DEV
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_BUNDLE_ENGINE: direct

    steps:
      # 01. Codigo aprovado pelo CI ou pela execucao manual na main.
      - name: Checkout do codigo aprovado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # 02. Impedir que o CD utilize um commit ultrapassado.
      - name: Conferir commit da main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          COMMIT_LOCAL="$(git rev-parse HEAD)"
          COMMIT_MAIN="$(git rev-parse FETCH_HEAD)"
          if [[ "$COMMIT_LOCAL" != "$COMMIT_MAIN" ]]; then
            echo "BLOQUEADO: a main avancou apos o CI."
            exit 1
          fi
          echo "Commit autorizado: $COMMIT_LOCAL"

      # 03. Repetir testes usando as dependencias do projeto.
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Executar testes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -v

      # 04. Usar a versao de CLI ja validada no laboratorio.
      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@v1.20.0

      - name: Validar autenticacao do Service Principal
        shell: bash
        run: |
          set -euo pipefail
          databricks jobs list --output json > /dev/null
          echo "Autenticacao OAuth M2M validada."

      # 05. Validar bundle, gerar plano JSON e executar a politica existente.
      - name: Validar Bundle DEV
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle validate -t dev

      - name: Gerar e validar plano de implantacao
        id: plano
        shell: bash
        run: |
          set -euo pipefail
          PLAN_FILE="${RUNNER_TEMP}/forja-dev-plan.json"
          databricks bundle plan -t dev -o json > "$PLAN_FILE"
          python scripts/ci/validate_bundle_plan.py "$PLAN_FILE"
          echo "file=$PLAN_FILE" >> "$GITHUB_OUTPUT"
          python - "$PLAN_FILE" >> "$GITHUB_OUTPUT" <<'PY'
          """Define se existem alteracoes no plano, sem expor o seu conteudo."""
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as arquivo:
              plano = json.load(arquivo)
          print("has_changes=" + str(bool(plano["plan"])).lower())
          PY

      # 06. Aplicar exatamente o plano aprovado, somente quando necessario.
      - name: Implantar plano aprovado
        if: steps.plano.outputs.has_changes == 'true'
        shell: bash
        env:
          PLAN_FILE: ${{ steps.plano.outputs.file }}
        run: |
          set -euo pipefail
          databricks bundle deploy -t dev --plan "$PLAN_FILE" --fail-on-active-runs

      - name: Confirmar ausencia de alteracoes
        if: steps.plano.outputs.has_changes == 'false'
        shell: bash
        run: echo "Nenhuma alteracao no Bundle DEV. Deploy dispensado."

      # 07. Registrar os recursos reconhecidos pelo Bundle.
      - name: Conferir recursos do Bundle
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle summary -t dev
          echo "Commit validado: $(git rev-parse HEAD)"
