
# =============================================================================
# PROJETO: Forja de Dados - ETL End to End - FinOps - IA
# ARQUIVO: .github/workflows/deploy-dev.yml
#
# OBJETIVO:
#   Executar o preflight do deployment DEV.
#   Validar autenticacao, Bundle e plano detalhado de alteracoes.
#
# IDENTIDADE:
#   sp-forja-cicd-dev
#
# SEGURANCA:
#   - Execucao manual somente na branch main.
#   - OAuth M2M via GitHub Secrets.
#   - Nenhum deploy executado.
#   - Nenhum recurso criado, alterado ou excluido.
#
# VERSIONAMENTO:
#   GitHub / GitHub Actions
# =============================================================================

name: CD - Preflight Databricks DEV

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-cd-dev
  cancel-in-progress: false

jobs:
  preflight-dev:
    name: Validar plano de implantacao DEV

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m

    steps:

      # -----------------------------------------------------------------------
      # 01 - CHECKOUT
      # -----------------------------------------------------------------------
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 02 - DATABRICKS CLI
      # -----------------------------------------------------------------------
      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@v1.20.0

      # -----------------------------------------------------------------------
      # 03 - AUTENTICACAO
      # -----------------------------------------------------------------------
      - name: Verificar autenticacao Databricks
        shell: bash
        run: |
          set -euo pipefail

          databricks jobs list --output json > /dev/null

          echo "Autenticacao OAuth M2M validada."

      # -----------------------------------------------------------------------
      # 04 - VALIDACAO DO BUNDLE
      # -----------------------------------------------------------------------
      - name: Validar Bundle DEV
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle validate -t dev

      # -----------------------------------------------------------------------
      # 05 - INVENTARIO DO DEPLOYMENT
      # -----------------------------------------------------------------------
      - name: Consultar recursos do Bundle
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle summary -t dev

      # -----------------------------------------------------------------------
      # 06 - PLANO RESUMIDO
      # -----------------------------------------------------------------------
      - name: Gerar plano DEV
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle plan -t dev

      # -----------------------------------------------------------------------
      # 07 - PLANO DETALHADO
      # -----------------------------------------------------------------------
      - name: Inspecionar diferencas do deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "FORJA DE DADOS - PLANO DETALHADO DEV"
          echo "Operacao somente leitura."

          databricks bundle plan -t dev -o json

          echo "Inspecao concluida. Nenhum deploy executado."
